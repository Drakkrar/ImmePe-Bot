[project]
name = "immepe-bot"
version = "0.1.0"
description = "Automated self-message sender for WhatsApp Web"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Francisco Ramos Sepulveda", email = "jramossepulveda3@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "playwright>=1.62.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
immepe-bot = "immepe_bot.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=immepe_bot --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/immepe_bot"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]
